[project]
name = "blitz-fut-backend"
version = "0.1.0"
description = "Django API for the Blitz Fut competition organizer"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-django>=4.14,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "competitions"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]
